# 不要になった Cloudflare Worker を削除する手動ワークフロー。
# Actions タブ → 「Delete Cloudflare Worker」→ Run workflow で Worker 名を指定して実行する。
name: Delete Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: '削除する Worker 名'
        required: true
        type: string

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # 22系の最新パッチを毎回取る（ランナーに入っている古い22系のままだと
          # Node.js のセキュリティ修正が反映されない。2026-10-21 の修正版は 22.23.4）
          check-latest: true
      - name: Delete worker
        run: npx wrangler@4 delete --name "${{ inputs.worker_name }}" --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
