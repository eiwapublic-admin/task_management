# main への push で Cloudflare Workers に自動デプロイする。
# 必要な GitHub Secrets（リポジトリの Settings → Secrets and variables → Actions）:
#   CLOUDFLARE_API_TOKEN   … Cloudflare ダッシュボードで発行（テンプレート「Workersを編集する」）
#   CLOUDFLARE_ACCOUNT_ID  … Cloudflare ダッシュボード右下の Account ID
#   SUPABASE_URL / SUPABASE_SERVICE_KEY / SESSION_SECRET / ANTHROPIC_API_KEY /
#   GMAIL_CLIENT_ID / GMAIL_CLIENT_SECRET / GMAIL_REFRESH_TOKEN
#     … Worker のシークレットとしてデプロイ時に自動同期される
# フロントエンドはデータ面を anon キーで直接読み書きしないため、
# VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY のビルド時注入は不要（廃止済み）。
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# デプロイ途中でのキャンセルは Worker のバージョン/シークレット不整合
# （error 10215）を起こすため、キャンセルせず順番に実行する
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # デプロイを先に実行する（シークレット同期をこのコマンドより先に行うと
      # 「未デプロイの新バージョンが残った」状態(error 10215)から自己復旧
      # できなくなるため、順序はこのまま維持する）。
      #
      # --message でコミットメッセージを Version History に残す。wrangler-action
      # の command: 入力はシェルを介さず引数分割されるため $DEPLOY_MESSAGE が
      # 展開されず、文字列そのまま渡ってしまう（実際に確認済み）。そのため
      # wrangler CLI を直接 run: で呼び出し、bash に変数展開させる。
      # 式(${{ }})をコマンド文字列に直接埋め込むとコミットメッセージ中の記号で
      # コマンドが壊れる/インジェクションの恐れがあるため、env 変数経由で渡す。
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
        run: npx wrangler deploy --message "$DEPLOY_MESSAGE"

      - name: Sync secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: whoami
          secrets: |
            SUPABASE_URL
            SUPABASE_SERVICE_KEY
            SESSION_SECRET
            ANTHROPIC_API_KEY
            GMAIL_CLIENT_ID
            GMAIL_CLIENT_SECRET
            GMAIL_REFRESH_TOKEN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
