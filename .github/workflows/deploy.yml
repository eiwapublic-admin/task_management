# main への push で Cloudflare Workers に自動デプロイする。
# 必要な GitHub Secrets（リポジトリの Settings → Secrets and variables → Actions）:
#   CLOUDFLARE_API_TOKEN   … Cloudflare ダッシュボードで発行（テンプレート「Workersを編集する」）
#   CLOUDFLARE_ACCOUNT_ID  … Cloudflare ダッシュボード右下の Account ID
#   VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY … フロントエンドのビルドに埋め込む公開値
#   SUPABASE_URL / SUPABASE_SERVICE_KEY / SESSION_SECRET / ANTHROPIC_API_KEY /
#   GMAIL_CLIENT_ID / GMAIL_CLIENT_SECRET / GMAIL_REFRESH_TOKEN
#     … Worker のシークレットとしてデプロイ時に自動同期される
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# デプロイ途中でのキャンセルは Worker のバージョン/シークレット不整合
# （error 10215）を起こすため、キャンセルせず順番に実行する
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # デプロイを先に実行する（wrangler-action はシークレット同期をコマンドより
      # 先に行うため、1ステップにまとめると「未デプロイの新バージョンが残った」
      # 状態(error 10215)から自己復旧できなくなる）
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Sync secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: whoami
          secrets: |
            SUPABASE_URL
            SUPABASE_SERVICE_KEY
            SESSION_SECRET
            ANTHROPIC_API_KEY
            GMAIL_CLIENT_ID
            GMAIL_CLIENT_SECRET
            GMAIL_REFRESH_TOKEN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
