# main への push で Cloudflare Workers に自動デプロイする。
# 必要な GitHub Secrets（リポジトリの Settings → Secrets and variables → Actions）:
#   CLOUDFLARE_API_TOKEN   … Cloudflare ダッシュボードで発行（テンプレート「Workersを編集する」）
#   CLOUDFLARE_ACCOUNT_ID  … Cloudflare ダッシュボード右下の Account ID
#   SUPABASE_URL / SUPABASE_SERVICE_KEY / SESSION_SECRET / ANTHROPIC_API_KEY /
#   GMAIL_CLIENT_ID / GMAIL_CLIENT_SECRET / GMAIL_REFRESH_TOKEN
#     … Worker のシークレットとしてデプロイ時に自動同期される
# フロントエンドはデータ面を anon キーで直接読み書きしないため、
# VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY のビルド時注入は不要（廃止済み）。
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時実行を避けるため、デプロイは常に1本ずつ順番に処理する。
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # マージコミットの1行目「Merge pull request #N from owner/branch」は
      # Version History で本文（PRタイトル）より先に表示されて読みにくいため、
      # 空行より後ろの本文部分だけを取り出す。本文が無い（マージコミットでない）
      # 場合は元のメッセージ全体をそのまま使う。
      - name: Compute deploy message
        id: deploy_message
        env:
          RAW_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
        run: |
          BODY="$(printf '%s\n' "$RAW_MESSAGE" | awk 'BEGIN{p=0} /^$/{p=1; next} p{print}')"
          if [ -z "$BODY" ]; then
            BODY="$RAW_MESSAGE"
          fi
          {
            echo "message<<DEPLOY_MESSAGE_EOF"
            echo "$BODY"
            echo "DEPLOY_MESSAGE_EOF"
          } >> "$GITHUB_OUTPUT"

      # コード配布とシークレット同期を1回の wrangler deploy にまとめる。
      # 以前は Sync secrets を別ステップ（別コマンド）に分けていたため、
      # デプロイのたびに Version History に「Manually deployed」というメッセージ無しの
      # 版がもう1つ増えてしまっていた。--secrets-file で同一コマンドに含めることで
      # バージョンを1つにまとめ、--message も正しく反映されるようにする。
      # シークレットは jq でJSONファイル化し、$RUNNER_TEMP（ジョブ終了で消える
      # 領域）に書き出す。デプロイ後は明示的に削除する。
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_MESSAGE: ${{ steps.deploy_message.outputs.message }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          SECRETS_FILE="$RUNNER_TEMP/worker-secrets.json"
          umask 077
          jq -n \
            --arg SUPABASE_URL "$SUPABASE_URL" \
            --arg SUPABASE_SERVICE_KEY "$SUPABASE_SERVICE_KEY" \
            --arg SESSION_SECRET "$SESSION_SECRET" \
            --arg ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY" \
            --arg GMAIL_CLIENT_ID "$GMAIL_CLIENT_ID" \
            --arg GMAIL_CLIENT_SECRET "$GMAIL_CLIENT_SECRET" \
            --arg GMAIL_REFRESH_TOKEN "$GMAIL_REFRESH_TOKEN" \
            '{
              SUPABASE_URL: $SUPABASE_URL,
              SUPABASE_SERVICE_KEY: $SUPABASE_SERVICE_KEY,
              SESSION_SECRET: $SESSION_SECRET,
              ANTHROPIC_API_KEY: $ANTHROPIC_API_KEY,
              GMAIL_CLIENT_ID: $GMAIL_CLIENT_ID,
              GMAIL_CLIENT_SECRET: $GMAIL_CLIENT_SECRET,
              GMAIL_REFRESH_TOKEN: $GMAIL_REFRESH_TOKEN
            }' > "$SECRETS_FILE"
          npx wrangler deploy --message "$DEPLOY_MESSAGE" --secrets-file "$SECRETS_FILE"
          rm -f "$SECRETS_FILE"

      - name: Remove secrets file (on failure)
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
