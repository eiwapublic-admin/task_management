# 【一時ファイル】バックアップの復元ドリル（2026-08-27）。
#
# docs/disaster-recovery.md 7章「年1回、バックアップから実際に復元できるか試す」を
# 本稼働開始前に前倒しで実施するための使い捨てワークフロー。本番プロジェクトには一切触れず、
# 検証用に新規作成した別のSupabaseプロジェクト（task_management-restore-drill）へ
# 最新バックアップ（eiwapublic-admin/task_management-backups）を流し込み、
# 主要テーブルの件数を検証する。
#
# ドリル終了後はこのファイルを削除し、GitHub Secrets の DRILL_DB_PASSWORD も削除すること
# （検証用プロジェクト自体もSupabaseダッシュボードから削除して構わない）。
#
# 必要な Secrets（このリポジトリの Settings > Secrets and variables > Actions）:
#   DRILL_DB_PASSWORD … 検証用プロジェクトのDBパスワード（本番の SUPABASE_DB_PASSWORD とは別物）
#   BACKUP_REPO_TOKEN … 既存のバックアップ用トークンをそのまま流用（読み取りのみ使用）
name: Restore Drill (temporary)

on:
  workflow_dispatch:

env:
  BACKUP_REPO: "eiwapublic-admin/task_management-backups"
  # 検証用プロジェクト（task_management-restore-drill）のSession pooler接続先。
  # 本番とはノード番号が異なる（本番は aws-1、こちらは aws-0）。
  DB_HOST: aws-0-ap-southeast-2.pooler.supabase.com
  DB_PORT: "5432"
  DB_USER: "postgres.wddvfbkbilauhyjpodcp"

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: バックアップリポジトリを取得
        uses: actions/checkout@v5
        with:
          repository: ${{ env.BACKUP_REPO }}
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backup

      - name: PostgreSQLクライアント(サーバーと同メジャー版)を用意
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: 接続文字列を組み立て
        env:
          DB_PASSWORD: ${{ secrets.DRILL_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "DRILL_DB_PASSWORD が設定されていません" >&2
            exit 1
          fi
          DB_PASSWORD=$(printf %s "$DB_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          export DB_PASSWORD
          ENC=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""))')
          URL="postgresql://${DB_USER}:${ENC}@${DB_HOST}:${DB_PORT}/postgres"
          echo "::add-mask::$URL"
          echo "DB_URL=$URL" >> "$GITHUB_ENV"

      - name: 接続テスト
        run: psql "$DB_URL" -Atc "select current_user, version()"

      - name: 復元 (schema → auth_data → data の順)
        run: |
          set -euo pipefail
          cd backup
          # schema.sql は「空のプロジェクトでも出る想定内のエラー」が2種類ある
          # （docs/disaster-recovery.md 3章）ため ON_ERROR_STOP は使わず、
          # ログに残った ERROR 行からその2種類を除外して他に無いか確認する。
          psql "$DB_URL" -f schema.sql > schema_restore.log 2>&1 || true
          cat schema_restore.log
          UNEXPECTED=$(grep -i '^psql:.*ERROR' schema_restore.log \
            | grep -viE 'schema "public" already exists|permission denied to change default privileges' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::schema.sql 復元で想定外のエラーがありました"
            echo "$UNEXPECTED"
            exit 1
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f auth_data.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f data.sql

      - name: 主要テーブルの件数を検証
        run: |
          set -euo pipefail
          psql "$DB_URL" -Atc "
            select 'tasks', count(*) from tasks
            union all select 'users', count(*) from users
            union all select 'activity_logs', count(*) from activity_logs
            union all select 'settings', count(*) from settings
            union all select 'daily_reports', count(*) from daily_reports
            union all select 'report_entries', count(*) from report_entries
            union all select 'report_photos', count(*) from report_photos
            union all select 'parking_violations', count(*) from parking_violations
            union all select 'chlorine_tests', count(*) from chlorine_tests
            union all select 'fire_inspections', count(*) from fire_inspections
            union all select 'closed_days', count(*) from closed_days
            union all select 'equipment_categories', count(*) from equipment_categories
            union all select 'equipment_items', count(*) from equipment_items
            union all select 'equipment_transactions', count(*) from equipment_transactions
            union all select 'equipment_tenants', count(*) from equipment_tenants
            union all select 'routine_templates', count(*) from routine_templates
            order by 1
          " | tee counts.txt
          {
            echo "## 復元ドリル結果"
            echo ""
            echo '```'
            cat counts.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
