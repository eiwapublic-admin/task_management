[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# React Router (SPA) 用: 存在しないパスは index.html にフォールバック
# ※ /api/* は netlify/functions 内の各関数が `config.path` で個別にルーティングするため対象外
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
