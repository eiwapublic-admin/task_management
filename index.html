<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 画面全体のピンチ拡大を禁止する（2026-08-12。意図せず一覧画面が拡大されたまま
         気づかず、画面の一部がはみ出して見える不具合の報告を受けて）。写真・PDFの
         拡大表示は AttachmentPreview.jsx が独自のJS実装で行っており、この設定と無関係 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#33604d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 2026-08-19: black-translucent はステータスバー領域にiOSが独自のブラー(モヤ)を
         被せてしまい、ロゴ・タイトルの上端がぼやけて見える不具合の原因だったため black に
         変更した。black-translucent はアプリの背景色をノッチの裏側まで拡張できる代わりに
         このブラーが常に掛かる仕様で、CSS側では回避できない。black はステータスバー分の
         領域を確保する代わりにブラーが掛からない（env(safe-area-inset-top) は 0 になるが、
         .app-header の calc(var(--space-2) + env(safe-area-inset-top)) はそのままで害はない） -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="タスク管理" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <title>タスク管理システム</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
